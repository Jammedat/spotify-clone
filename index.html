<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
    <title>Spotify : Music player for everyone</title>
</head>
<body>
    <div class="container flex bg-black">
        <div class="left ">
          <div class="close">
            <img class="invert" src="img/close.svg" alt="">
          </div>
            <div class="home bg-grey m-1 rounded p-1">
                <div class="logo"><img src="img/logo.svg" alt="logo" class="svgColor invert"></div>
                <ul>
                    <li> <img src="img/home.svg" alt="home" class="svgColor invert">Home</li>
                    <li> <img src="img/search.svg" alt="search" class="svgColor invert">Search</li>
                </ul>
            </div>
            <div class="library  bg-grey rounded p-1 m-1">
                <div class="footer">
                    <div>
                        <a href="https://www.spotify.com/np-en/legal/">
                          <span>Legal</span>
                        </a>
                      </div>
                      <div>
                        <a href="https://www.spotify.com/np-en/safetyandprivacy/">
                          <span style="white-space: nowrap;">Safety & Privacy Center</span>
                        </a>
                      </div>
                      <div>
                        <a href="https://www.spotify.com/np-en/legal/privacy-policy/">
                          <span style="white-space: nowrap;">Privacy Policy</span>
                        </a>
                      </div>
                      <div>
                        <a href="https://www.spotify.com/np-en/legal/cookies-policy/">
                          <span>Cookies</span>
                        </a>
                      </div>
                      <div>
                        <a href="https://www.spotify.com/np-en/legal/privacy-policy/#s3">
                          <span style="white-space: nowrap;">About Ads</span>
                        </a>
                      </div>
                      <div>
                        <a href="https://www.spotify.com/np-en/accessibility/">
                          <span>Accessibility</span>
                        </a>
                      </div>
                      <div>
                        <a href="https://www.spotify.com/legal/cookies-policy/" target="_blank" rel="noopener">
                            <span>Cookies</span>
                        </a>
                      </div>
                
                </div>
                <div class="heading"> <img src="img/library.svg" class="invert">
                    <h2>Your Library</h2>

                </div>
                <div class="songs-lists">
                  <ul>
                  
                  </ul>
                </div>
            </div>
        </div>
        <div class="right rounded bg-grey">
            <div class="header">
                <div class="nav">
                  <div class="hamburgerCont">
                    <img class="invert hamburger" src="img/hamburger.svg" alt="">
                    <img class="invert" src = "img/left.svg" alt="left arrow">
                    <img class="invert" src = "img/right.svg" alt="right arrow">
                  </div>
                </div>
                <div class="buttons">
                    <button class="signupbtn">Sign Up</button>
                    <button class="loginbtn">Log in</button>
                </div>
            </div>
            <div class="spotify-playlists">
              <h1>Spotify Playlists </h1>
              <div class="cardContainer">
          
            </div>
            <div class="playbar">
              <div class="seekbar">
                <div class="circle"></div>
              </div>

              <div class="abovebar">

                <div class="songinfo">
                  
                </div>
                <div class="songsbuttons">
                  <img width="35" id="previous" class="invert" src="img/previous.svg" alt="">
                  <img width="35" id="play" class="invert"  src="img/playbar.svg" alt="">
                  <img width="35" id="next" class="invert" src="img/next.svg" alt="">
                </div>
                <div class="time-sound">

                  <div class="songtime">
                    
                  </div>
                  <div class="volume invert">
            
                    <img src="img/volume.svg" alt="">
                    <div class="range">
                      <input type="range" name="volume" id="">
                    </div>
                  </div>
                </div>
              </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
